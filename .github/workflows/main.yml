name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Warung Medan source files
        run: |
          test -f pubspec.yaml || (echo "pubspec.yaml tidak ditemukan di root repository" && exit 1)
          test -f lib/main.dart || (echo "lib/main.dart tidak ditemukan di root repository" && exit 1)
          test -f lib/helpers/database_helper.dart || (echo "lib/helpers/database_helper.dart tidak ditemukan di root repository" && exit 1)
          grep -q "WarungMedanApp" lib/main.dart || (echo "lib/main.dart bukan source Warung Medan POS" && exit 1)

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable

      - name: Generate Flutter Android files
        run: flutter create . --platforms=android --org com.ctcatering --project-name warung_medan_pos --no-pub

      - name: Configure Android storage permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>'
          if permission not in text:
              text = text.replace('<application', f'{permission}\n    <application', 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warung-medan-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
